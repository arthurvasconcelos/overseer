<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <style>
    @keyframes blink { 0%, 55% { opacity: 1 } 56%, 100% { opacity: 0 } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <defs>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6f2"/>
      <stop offset="0.35" stop-color="#ff87d7"/>
      <stop offset="1" stop-color="#875fff"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1e1a2e"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#453d66" stroke-width="4"/>
  <circle cx="32" cy="32" r="15" fill="url(#iris)"/>
  <rect class="cursor" x="28.5" y="25" width="7" height="14" rx="1" fill="#1e1a2e"/>
  <circle cx="24.5" cy="24.5" r="2.4" fill="#fff" fill-opacity="0.85"/>
</svg>
